# Publishes the Windows app as a GitHub release, which installed copies update themselves from.
#
# Runs on each push to main that changes the game or the desktop app (merged PRs that only touch
# docs, tests, tools or the archive don't make a release). It can also be started by hand:
# Actions -> "Windows exe" -> Run workflow.
#
# The release is tagged v<MAJOR>.<MINOR>.<run number> (MAJOR.MINOR from the root package.json), so each
# one is newer than the last. It holds the installer (auto-updates), the portable exe (doesn't) and
# latest.yml, the file the installed app checks.
name: Windows exe
on:
  push:
    branches: [main]
    paths:
      - index.html
      - css/**
      - js/**
      - vendor/**
      - desktop/**
      - '!desktop/make-icon.mjs'
      - package.json
  workflow_dispatch:
# one release at a time; a push that lands while one is building waits, then ships everything new
concurrency:
  group: windows-release
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          PUBLISH: always
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: neon-trench-windows
          path: desktop/dist/*.exe
          if-no-files-found: error
