# Builds the Windows exe (portable + installer) on a Windows runner. Runs only when started by hand:
# Actions tab -> "Windows exe" -> Run workflow. The exes appear as a download under the run's Artifacts.
name: Windows exe
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: neon-trench-windows
          path: desktop/dist/*.exe
          if-no-files-found: error
